name: Deploy Vừa Đi Vừa Học to Firebase & GCP

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyC77Rt8N3un-YHAMPGaRCBKIwxeZjbpMSI' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'vuadivuahoc-5187a.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'vuadivuahoc-5187a' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'vuadivuahoc-5187a.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '791378523101' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:791378523101:web:64ba7cae974b1144353c34' }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || 'AQ.Ab8RN6Jy6z-TgQsv3zEuFq8N23Lqwzu8PMqFJ3v664Leu5W5Iw' }}

      - name: Deploy to Firebase Hosting
        run: |
          if [ -n "$SA_KEY_1" ]; then
            echo "$SA_KEY_1" > sa_key.json
          elif [ -n "$SA_KEY_2" ]; then
            echo "$SA_KEY_2" > sa_key.json
          elif [ -n "$SA_KEY_3" ]; then
            echo "$SA_KEY_3" > sa_key.json
          elif [ -n "$SA_KEY_4" ]; then
            echo "$SA_KEY_4" > sa_key.json
          elif [ -n "$SA_KEY_5" ]; then
            echo "$SA_KEY_5" > sa_key.json
          else
            echo "❌ LỖI KHỞI TẠO: Chưa tìm thấy Secret chìa khóa Firebase trong GitHub Repository Secrets!"
            echo "Vui lòng truy cập: https://github.com/thaihien1011/vuadivuahoc/settings/secrets/actions"
            echo "Tạo New Repository Secret đặt tên: FIREBASE_SERVICE_ACCOUNT_KEY và dán nội dung file JSON vào."
            exit 1
          fi

          export GOOGLE_APPLICATION_CREDENTIALS=sa_key.json
          npx firebase-tools deploy --only hosting --project vuadivuahoc-5187a --non-interactive
          rm -f sa_key.json
        env:
          SA_KEY_1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SA_KEY_2: ${{ secrets.GCP_SA_KEY }}
          SA_KEY_3: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_KEY_4: ${{ secrets.VUADIVUAH0C_5187A }}
          SA_KEY_5: ${{ secrets.VUADIVUAHOC_5187A }}





